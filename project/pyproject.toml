[project]
name = "you-are-bot"
version = "0.1.0"
description = "Детекция ботов в диалогах, проект по курсу ProdML"
requires-python = "==3.12.*"
dependencies = [
    "catboost==1.2.10",
    "matplotlib==3.11.2",
    "mlflow==3.17.2",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.1",
]

[dependency-groups]
eda = [
    "ipykernel==7.4.0",
    "jupyter==1.1.1",
    "nbconvert==7.17.2",
    "nbformat==5.11.1",
]
